[package]
name = "puw_notch_setup"
version = "1.0.44"
edition = "2021"
description = "PUW Notch Setup: installer & uninstaller for Windows"

[[bin]]
name = "puw_notch_setup"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.31"
flate2 = "1.1"
windows-core = "0.61"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
flate2 = "1.1"
