[package]
name = "puw_notch"
version = "1.0.14"
edition = "2021"
description = "PUW Notch: a living notch for Windows"

[dependencies]
# Already pulled in by `windows`; named here because D2D point types come from it.
windows-numerics = "0.2"
# Already pulled in by `windows`; the `#[implement]` macro (audio volume callback) expands to it.
windows-core = "0.61"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_WinRT",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Foundation",
    "Foundation_Collections",
    "Devices_Radios",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Networking_Connectivity",
    "Media_Control",
    "Storage_Streams",
    "Web_Http",
    "Web_Http_Headers",
    "Data_Json",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Imaging_D2D",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
